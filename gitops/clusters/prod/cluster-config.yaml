apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-cluster-config
  namespace: argocd
  labels:
    environment: prod
    managed-by: argocd
data:
  note: "demo-only-multi-cluster-not-deployed"
  cluster_name: "eks-prod-cluster"
  kubernetes_version: "1.34"
  aws_region: "us-east-1"
  environment: "prod"
  node_group_min_size: "3"
  node_group_max_size: "10"
  node_group_desired_size: "5"
  # Add-on versions for Kubernetes 1.34 — verify current values at:
  # https://docs.aws.amazon.com/eks/latest/userguide/managing-add-ons.html
  coredns_version: "v1.11.4-eksbuild.7"
  kube_proxy_version: "v1.34.3-eksbuild.2"
  vpc_cni_version: "v1.23.0-eksbuild.1"
  ebs_csi_version: "v1.36.0-eksbuild.1"
  auto_sync: "false"
  upgrade_window: "maintenance"
