apiVersion: v1
kind: ConfigMap
metadata:
  name: prod-cluster-config
  namespace: argocd
  labels:
    environment: prod
    managed-by: argocd
data:
  note: "demo-only-multi-cluster-not-deployed"
  cluster_name: "eks-prod-cluster"
  kubernetes_version: "1.30"
  aws_region: "us-east-1"
  environment: "prod"
  node_group_min_size: "3"
  node_group_max_size: "10"
  node_group_desired_size: "5"
  coredns_version: "v1.11.1-eksbuild.11"
  kube_proxy_version: "v1.30.3-eksbuild.5"
  vpc_cni_version: "v1.18.3-eksbuild.3"
  ebs_csi_version: "v1.33.0-eksbuild.1"
  auto_sync: "false"
  upgrade_window: "maintenance"
